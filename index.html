<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜市游戏摊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;600&display=swap">
<style>
/* Layout: two views — a directory of lantern-lit stalls (one card per game), and a full-height play view: thin bar on top, the game's stage below */
:root {
  --night: #0b1424;
  --surface: #111d31;
  --surface-2: #17263d;
  --line: rgba(159, 179, 200, 0.16);
  --ink: #eef3f7;
  --mist: #9fb3c8;
  --glow: #e3f07a;
  --display: "ZCOOL XiaoWei", "Songti SC", "STSong", "SimSun", serif;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* ---------- directory ---------- */
.hub {
  min-height: 100%;
  max-width: 1040px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 40px 32px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.hub header { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.22em; color: var(--mist); }
.hub h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(40px, 9vw, 64px);
  line-height: 1.05;
  color: var(--glow);
  text-shadow: 0 0 22px rgba(227, 240, 122, 0.35);
  text-wrap: balance;
}
.lede { margin: 0; max-width: 34em; line-height: 1.8; color: var(--ink); }

/* one hanging lantern per stall, each in its game's colour */
.hub header { position: relative; }
.garland { display: flex; align-items: flex-start; gap: 22px; margin-bottom: 2px; }
.hang { display: flex; flex-direction: column; align-items: center; transform-origin: top center; animation: sway 5s ease-in-out infinite alternate; }
.hang::before { content: ""; width: 1px; height: var(--drop, 20px); background: rgba(159, 179, 200, 0.35); }
.hang .lantern { width: 22px; height: 27px; }
.hang:nth-child(2n) { animation-duration: 6.5s; animation-delay: -2s; }
.hang:nth-child(3n) { animation-duration: 4.2s; animation-delay: -1s; }
@keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@media (min-width: 640px) {
  .garland { position: absolute; top: -40px; right: 0; height: auto; margin: 0; gap: 34px; }
  .hang .lantern { width: 30px; height: 36px; }
}

.stalls {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 16px;
}
.stall {
  --accent: var(--glow);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
  min-width: 0;
  padding: 26px 20px 18px;
  text-align: left;
  color: var(--ink);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color 0.2s ease, transform 0.2s ease;
}
.stall:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); transform: translateY(-2px); }
.stall:hover .lantern { box-shadow: 0 0 26px 6px color-mix(in srgb, var(--accent) 55%, transparent); }

.lantern {
  position: relative;
  width: 30px;
  height: 36px;
  border-radius: 45% 45% 42% 42% / 50% 50% 46% 46%;
  background: radial-gradient(circle at 50% 40%, #fffbe6 0%, var(--accent) 38%, color-mix(in srgb, var(--accent) 70%, #000) 100%);
  box-shadow: 0 0 18px 3px color-mix(in srgb, var(--accent) 45%, transparent);
  transition: box-shadow 0.2s ease;
}
.lantern::before, .lantern::after {
  content: "";
  position: absolute;
  left: 50%;
  width: 14px;
  height: 4px;
  transform: translateX(-50%);
  background: #3b2a1c;
  border-radius: 2px;
}
.lantern::before { top: -3px; }
.lantern::after { bottom: -3px; }

.stall h2 {
  margin: 4px 0 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: 28px;
  line-height: 1.15;
  color: var(--ink);
}
.stall .tag { margin: 0; font-size: 14px; line-height: 1.7; color: var(--ink); opacity: 0.88; }
.stall .meta {
  margin-top: auto;
  padding-top: 10px;
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 12px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--mist);
  font-variant-numeric: tabular-nums;
}
.stall .best b { color: var(--accent); font-weight: 600; font-size: 14px; }

.foot { margin: auto 0 0; font-size: 12px; color: var(--mist); }

/* ---------- play view ---------- */
.play { height: 100%; display: flex; flex-direction: column; }
.playbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--night);
}
.playbar button {
  font-size: 13px;
  color: var(--mist);
  background: transparent;
  border: 1px solid rgba(159, 179, 200, 0.3);
  border-radius: 999px;
  padding: 5px 14px;
  cursor: pointer;
}
.playbar button:hover { color: var(--ink); border-color: var(--mist); }
.playbar .now { font-family: var(--display); font-size: 20px; color: var(--ink); }
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.mg-root { position: absolute; inset: 0; overflow: hidden; }
.broken { padding: 32px 16px; color: var(--mist); line-height: 1.8; }

@media (prefers-reduced-motion: reduce) {
  .stall, .lantern { transition: none; }
  .hang { animation: none; }
  .stall:hover { transform: none; }
}
</style>
</head>
<body>
<main class="hub" id="hub">
  <header>
    <div class="garland" id="garland" aria-hidden="true"></div>
    <p class="eyebrow">夜里开张 · <span id="stallCount">几</span>个摊位</p>
    <h1>夜市游戏摊</h1>
    <p class="lede">每个灯笼底下是一款小游戏，一局几分钟。挑一个摊位坐下来玩吧。</p>
  </header>
  <div class="stalls" id="stalls"></div>
  <p class="foot">最高分只保存在这台设备的浏览器里。</p>
</main>

<div class="play" id="play" hidden>
  <div class="playbar">
    <button type="button" id="backBtn">← 回到夜市</button>
    <span class="now" id="playTitle"></span>
  </div>
  <div class="stage" id="stage"></div>
</div>

<!-- Each game registers itself on window.MiniGames. See README for the contract. -->
<script src="games/firefly.js"></script>
<script src="games/dragon.js"></script>
<script src="games/jieqi.js"></script>
<script src="games/lantern2048.js"></script>
<script>
(() => {
  'use strict';
  const games = window.MiniGames || [];
  const $ = (id) => document.getElementById(id);
  const hub = $('hub'), play = $('play'), stage = $('stage'), stalls = $('stalls'), playTitle = $('playTitle');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };
  const bestKey = (g) => 'mg-best-' + g.id;
  function bestOf(g) {
    const v = parseFloat(store.get(bestKey(g)));
    return Number.isFinite(v) ? v : null;
  }

  function renderStalls() {
    $('stallCount').textContent = ['零', '一', '两', '三', '四', '五', '六', '七', '八', '九'][games.length] || String(games.length);
    const garland = $('garland');
    garland.textContent = '';
    games.forEach((g, i) => {
      const h = document.createElement('span');
      h.className = 'hang';
      h.style.setProperty('--drop', [18, 42, 28, 54, 24, 36][i % 6] + 'px');
      h.style.setProperty('--accent', g.accent || '#e3f07a');
      h.innerHTML = '<span class="lantern"></span>';
      garland.appendChild(h);
    });
    stalls.textContent = '';
    for (const g of games) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'stall';
      b.dataset.id = g.id;
      b.style.setProperty('--accent', g.accent || '#e3f07a');
      b.innerHTML = `
        <span class="lantern" aria-hidden="true"></span>
        <h2></h2>
        <p class="tag"></p>
        <span class="meta"><span class="ctl"></span><span class="best"></span></span>`;
      b.querySelector('h2').textContent = g.title;
      b.querySelector('.tag').textContent = g.tagline || '';
      b.querySelector('.ctl').textContent = g.controls || '';
      const bestEl = b.querySelector('.best');
      const best = bestOf(g);
      if (best === null) bestEl.textContent = '还没玩过';
      else {
        bestEl.append(g.lowerIsBetter ? '最佳 ' : '最高 ');
        const strong = document.createElement('b');
        strong.textContent = best;
        bestEl.append(strong, ' ' + (g.bestLabel || '分'));
      }
      b.addEventListener('click', () => open(g.id));
      stalls.appendChild(b);
    }
  }

  let current = null;

  function open(id) {
    const g = games.find((x) => x.id === id);
    if (!g) return;
    close();
    hub.hidden = true;
    play.hidden = false;
    playTitle.textContent = g.title;
    const root = document.createElement('div');
    root.className = 'mg-root';
    stage.appendChild(root);
    const api = {
      getBest: () => bestOf(g),
      submitScore(v) {
        const b = bestOf(g);
        const isNew = Number.isFinite(v) && (b === null || (g.lowerIsBetter ? v < b : v > b));
        if (isNew) store.set(bestKey(g), String(v));
        return { best: isNew ? v : b, isNew };
      },
      exit: () => goHome(),
    };
    let cleanup = null;
    try {
      cleanup = g.mount(root, api);
    } catch (e) {
      console.error(e);
      root.innerHTML = '<p class="broken">这个摊位暂时出了点问题。点左上角回到夜市，换一个玩吧。</p>';
    }
    current = { g, root, cleanup };
    try { history.replaceState(null, '', '#' + g.id); } catch (e) { /* sandboxed */ }
  }

  function close() {
    if (!current) return;
    try { if (typeof current.cleanup === 'function') current.cleanup(); } catch (e) { console.error(e); }
    current.root.remove();
    current = null;
  }

  function goHome() {
    const last = current && current.g.id;
    close();
    play.hidden = true;
    hub.hidden = false;
    renderStalls();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* sandboxed */ }
    const btn = last && stalls.querySelector(`[data-id="${last}"]`);
    if (btn) btn.focus();
  }

  $('backBtn').addEventListener('click', goHome);

  renderStalls();
  const start = location.hash.slice(1);
  if (start && games.some((g) => g.id === start)) open(start);
})();
</script>
</body>
</html>
